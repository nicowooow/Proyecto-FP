server {
  listen 80;
  server_name demo.treedlink.com;
  return 301 https://$server_name$request_uri;
}

server {
  listen 443 ssl;
  server_name demo.treedlink.com;
  
  ssl_certificate /etc/letsencrypt/live/demo.treedlink.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/demo.treedlink.com/privkey.pem;
  
    location = /robots.txt {
    types { }
    default_type text/plain;
    return 200 "User-agent: *\nAllow: /\nSitemap: https://demo.treedlink.com/sitemap.xml";
  }
  
  location = /sitemap.xml {
    default_type application/xml;
    return 200 '<?xml version="1.0"?>
  <urlset>
    <url><loc>https://demo.treedlink.com/</loc><priority>1.0</priority><changefreq>daily</changefreq></url>
    <url><loc>https://demo.treedlink.com/Recent_Pages</loc><priority>0.9</priority><changefreq>hourly</changefreq></url>
    <url><loc>https://demo.treedlink.com/Sign_up</loc><priority>0.8</priority></url>
    <url><loc>https://demo.treedlink.com/YourTree</loc><priority>0.7</priority></url>
  </urlset>';
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
  
  location /yourtree/api/ {
    proxy_pass http://backend:3000;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  }
}
