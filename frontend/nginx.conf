server {
  listen 443 ssl http2;
  server_name demo.treedlink.com;
  
  ssl_certificate /etc/letsencrypt/live/demo.treedlink.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/demo.treedlink.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  # Serve robots.txt
  location = /robots.txt {
    root /usr/share/nginx/html;
    types { }
    default_type text/plain;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }
  
  # Serve ads.txt
  location = /ads.txt {
    root /usr/share/nginx/html;
    types { }
    default_type text/plain;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }
  
  # Serve sitemap.xml
  location = /sitemap.xml {
    root /usr/share/nginx/html;
    default_type application/xml;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # Serve web manifest
  location = /site.webmanifest {
    root /usr/share/nginx/html;
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # Serve favicons with proper cache headers
  location ~* ^/(favicon|apple-touch-icon|web-app-manifest|browserconfig)\.(svg|ico|png|xml)$ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
    try_files $uri =404;
  }

  # Static assets
  location ~* \.(js|css|svg|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|webp)$ {
    # root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
    access_log off;
    try_files $uri =404;
  }

  # Main app
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  
  # API proxy
  location /yourtree/api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
