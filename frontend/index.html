<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Favicon y Web App Icons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="YourTree" />
  <meta name="application-name" content="YourTree" />
  <meta name="msapplication-TileColor" content="#ffffff" />
  <meta name="msapplication-config" content="/browserconfig.xml" />

  <!-- Web App Manifest -->
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Meta Tags Básicas -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="charset" content="UTF-8" />
  <meta name="language" content="English" />
  <meta name="description"
    content="YourTree is a link in bio & community platform. Share your profile, connect with others, and build your online presence." />
  <meta name="keywords" content="link in bio, profile, community, social, bio link" />
  <meta name="author" content="YourTree" />
  <meta name="robots" content="index, follow" />
  <meta name="googlebot" content="index, follow" />

  <!-- Open Graph Meta Tags -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="YourTree" />
  <meta property="og:title" content="YourTree - Link in Bio & Community" />
  <meta property="og:description"
    content="YourTree is a link in bio & community platform. Share your profile, connect with others, and build your online presence." />
  <meta property="og:image" content="https://demo.treedlink.com/web-app-manifest-512x512.png" />
  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />
  <meta property="og:url" content="https://demo.treedlink.com" />

  <!-- Twitter Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@YourTree" />
  <meta name="twitter:title" content="YourTree - Link in Bio & Community" />
  <meta name="twitter:description"
    content="YourTree is a link in bio & community platform. Share your profile, connect with others, and build your online presence." />
  <meta name="twitter:image" content="https://demo.treedlink.com/web-app-manifest-512x512.png" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#ffffff" />

  <title>YourTree - Link in Bio & Community</title>

  <!-- Google Site Verification -->
  <meta name="google-site-verification" content="2yNyW20IJ9MCywx7cNiFzgNkB_eu3sR0zf5XKcQ4Ozo" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Shadows+Into+Light&family=Zalando+Sans+Expanded:ital,wght@0,200..900;1,200..900&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Roboto|Merriweather|Alegreya&display=swap" rel="stylesheet" />
  <link href="https://fonts.cdnfonts.com/css/made-gentle" rel="stylesheet" />

  <!-- Google AdSense -->
  <meta name="google-adsense-account" content="ca-pub-2594335980275254">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2594335980275254"
    crossorigin="anonymous"></script>

  <!-- Theme Script -->
  <script>//importante para la parte de tema
    (function () {
      try {
        var savedTheme = localStorage.getItem("theme") || "dark";//tema que guardamos previamente en el navegador
        document.documentElement.setAttribute("data-theme", savedTheme);//esto nos da el tema guardado en el navegador 
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");//si el tema no esta o sale un error nos pone el negro por defecto
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="./src/main.jsx"></script>
</body>

</html>
